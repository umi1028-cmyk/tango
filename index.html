    // --- 音声生成 ---
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    function playSound(isCorrect) {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      if(isCorrect) {
        osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.frequency.setValueAtTime(1760, audioCtx.currentTime + 0.1);
      } else {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(140, audioCtx.currentTime);
      }
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
      osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }

    }

      const filtered = vocabData.filter(w => w.section == sec);
      currentWords = filtered.sort(() => Math.random() - 0.5).slice(0, 10);
      
      score = 0; currentIndex = 0; combo = 0; wrongList = [];
      document.getElementById('setup-area').style.display = 'none';
      document.getElementById('game-area').style.display = 'block';
      nextQuestion();
    }

    function nextQuestion() {
      if (currentIndex >= currentWords.length) { showResult(); return; }
      const word = currentWords[currentIndex];
      document.getElementById('en-word').innerText = word.en;
      document.getElementById('question-count').innerText = `Q. ${currentIndex + 1} / ${currentWords.length}`;
      document.getElementById('combo-display').innerText = `🔥 ${combo} COMBO`;

      let wrongs = vocabData.filter(w => w.ja !== word.ja).sort(() => Math.random() - 0.5).slice(0, 3);
      let choices = [word, ...wrongs].sort(() => Math.random() - 0.5);
      
      const area = document.getElementById('options-area');
      area.innerHTML = '';
      choices.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'btn-option'; btn.innerText = c.ja;
        btn.onclick = () => checkAnswer(c.ja, word.ja);
        area.appendChild(btn);
      });
      startTimer();
    }

    function startTimer() {
      clearInterval(timerInterval);
      timeLeft = TIME_LIMIT;
      const bar = document.getElementById('timer-bar');
      timerInterval = setInterval(() => {
        timeLeft -= 0.05;
        bar.style.width = (timeLeft / TIME_LIMIT * 100) + '%';
        if (timeLeft <= 0) { checkAnswer(null, currentWords[currentIndex].ja); }
      }, 50);
    }

    function checkAnswer(selected, correct) {
      clearInterval(timerInterval);
      const flash = document.getElementById('flash');
      if (selected === correct) {
        score++; combo++; playSound(true);
        flash.style.animation = 'none'; flash.offsetHeight; flash.style.animation = 'flashCorrect 0.4s';
      } else {
        combo = 0; wrongList.push(currentWords[currentIndex]); playSound(false);
        flash.style.animation = 'none'; flash.offsetHeight; flash.style.animation = 'flashWrong 0.4s';
      }
      currentIndex++;
      setTimeout(nextQuestion, 500);
    }

    function showResult() {
      document.getElementById('game-area').style.display = 'none';
      document.getElementById('result-area').style.display = 'block';
      document.getElementById('battle-bgm').pause();
      
      const percent = (score / currentWords.length) * 100;
      document.getElementById('final-score').innerText = `${score} / ${currentWords.length}`;
      
      let audioFile = "ScreenRecording_05-03-2026 19-55-13_1.mov";
      if(percent >= 80) audioFile = "ScreenRecording_05-03-2026 18-55-03_1_2.mov";
      new Audio(audioFile).play();

      const listArea = document.getElementById('wrong-list-display');
      if (wrongList.length > 0) {
        listArea.innerHTML = "<strong>復習リスト:</strong><br>" + 
          wrongList.map(w => `<span style="color:#ffeb3b">${w.en}</span> : ${w.ja}`).join('<br>');
      } else {
        listArea.innerHTML = "Perfect! この調子で全1900語を目指そう！";
      }
    }
  </script>
</body>
</html>
